server:
  port: ${PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: cloud-monitor-backend
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  aws:
    # Region the EC2 and CloudWatch clients talk to.
    region: ${AWS_REGION:ap-south-1}
    # true  -> generated instances and metrics, no AWS calls (safe default for local runs)
    # false -> real DescribeInstances / GetMetricData calls, credentials required
    demo-mode: ${DEMO_MODE:true}
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-a-long-random-value-1234567890}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:8h}
  demo-auth:
    username: ${DEMO_USERNAME:admin}
    password: ${DEMO_PASSWORD:admin123}
    role: ${DEMO_ROLE:ADMIN}
  cors:
    # Only needed when the browser calls this API cross-origin; the Vite proxy and the shipped
    # nginx config both keep the API on the same origin. Comma-separated list.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    com.yeshwanth.cloudmonitor: ${LOG_LEVEL:INFO}
