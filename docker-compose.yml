services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cloud_monitor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/cloud_monitor
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-to-a-long-random-value-1234567890}
    ports: ["8080:8080"]
    depends_on: [postgres]

  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [backend]

volumes:
  postgres_data:
